on:
  push:
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cc', '**.cpp', '**.h', '**.hpp', '**.stan', 'DESCRIPTION', 'NAMESPACE', 'src/Makevars', 'src/Makevars.win', 'configure', 'configure.win', '**.yml', 'renv.lock']
  pull_request:
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cc', '**.cpp', '**.h', '**.hpp', '**.stan', 'DESCRIPTION', 'NAMESPACE', 'src/Makevars', 'src/Makevars.win', 'configure', 'configure.win', '**.yml', 'renv.lock']
  schedule:
    - cron: '13 12 * * 1-5'

name: unit-tests

jobs:

  unit-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    uses: jasp-stats/jasp-actions/.github/workflows/unittests.yml@v1
    with:
      needs_JAGS: false
